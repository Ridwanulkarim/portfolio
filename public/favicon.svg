<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#040407" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.6)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.3)" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Monogram R -->
  <text 
    x="50%" 
    y="65%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" 
    font-size="56" 
    font-weight="800" 
    fill="url(#textGrad)"
  >R</text>

  <!-- Active Status Dot -->
  <circle cx="75" cy="25" r="7" fill="#10b981" />
</svg>